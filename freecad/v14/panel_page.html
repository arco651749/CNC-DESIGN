<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v14 電控背板</title>
<style>html,body{margin:0;height:100%;background:#eef1f4;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#1d2630}
#c{width:100%;height:100%;display:block}#ui{position:absolute;left:12px;top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#ffffffd9;border:1px solid #c9d1da;border-radius:8px;padding:6px 10px}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid #9aa6b3;border-radius:6px;background:#fff;cursor:pointer}
#info{position:absolute;left:12px;bottom:10px;background:#ffffffd9;border:1px solid #c9d1da;border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.6;max-width:min(620px,calc(100% - 48px))}</style></head>
<body><canvas id="c"></canvas>
<div id="ui"><b>v14 電控背板</b><button data-v="front">正視（元件面）</button><button data-v="iso">等角</button><button data-v="side">側視</button><button id="kp">禁區 顯示</button></div>
<div id="info">/*INFO*/</div>
<!--THREE-->
<script>
/*DATA*/
const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef1f4);
const cam=new THREE.PerspectiveCamera(30,1,5,5000);cam.up.set(0,1,0);const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8070,0.85));const d1=new THREE.DirectionalLight(0xffffff,0.6);d1.position.set(-300,500,900);scene.add(d1);
const K=new THREE.Group();scene.add(K);
function b64(s,T){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)}
for(const p of DATA){const q=b64(p.p,Int16Array),pos=new Float32Array(q.length);for(let i=0;i<q.length;i++)pos[i]=q[i]/10;
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(new THREE.BufferAttribute(b64(p.i,p.w?Uint16Array:Uint32Array),1));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color(...p.c),metalness:0.1,roughness:0.65,transparent:!!p.k,opacity:p.k?0.18:1,depthWrite:!p.k,side:THREE.DoubleSide}));(p.k?K:scene).add(m)}
const T=new THREE.Vector3(145,130,40);const VIEWS={front:[145,130,820],iso:[-260,420,620],side:[-650,130,90]};
function view(k){cam.position.set(...VIEWS[k]);ctl.target.copy(T);ctl.update()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const kb=document.getElementById('kp');kb.onclick=()=>{K.visible=!K.visible;kb.textContent=K.visible?'禁區 隱藏':'禁區 顯示'};K.visible=false;
window.view=view;window.K=K;window.renderOnce=()=>{ctl.update();R.render(scene,cam)};
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();view('front');
(function loop(){if(!window.PAUSE){ctl.update();R.render(scene,cam)}requestAnimationFrame(loop)})();
</script></body></html>
