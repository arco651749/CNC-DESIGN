<meta charset="utf-8">
<title>v10 調校動畫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* layout: one-screen app. The 3D stage fills the screen; the step panel docks right on wide screens and at the bottom on phones. */
:root{--bg:#F1F0EB;--panel:#FDFCF9;--fg:#16232E;--mut:#52606B;--line:#D6D2C6;--measure:#B4481A;--measure-fill:#D9622B;--motion:#2A6F97;--ok:#256B43;--bad:#B3261E;--chip:#ECEAE3;--face:#FFFFFF;
 --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;--num:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A21;--panel:#1A242D;--fg:#EEF1F2;--mut:#A9B4BC;--line:#33414D;--measure:#F0A27C;--measure-fill:#E0703A;--motion:#7FB8DA;--ok:#6CC08B;--bad:#F2877F;--chip:#24313B;--face:#10171D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121A21;--panel:#1A242D;--fg:#EEF1F2;--mut:#A9B4BC;--line:#33414D;--measure:#F0A27C;--measure-fill:#E0703A;--motion:#7FB8DA;--ok:#6CC08B;--bad:#F2877F;--chip:#24313B;--face:#10171D;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#app{height:100%;display:flex}
#stage{position:relative;flex:1;min-width:0;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{width:384px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
#head{padding-block:18px 10px}
#kick{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--measure)}
h1{margin:4px 0 0;font-size:22px;line-height:1.3;font-weight:700;text-wrap:balance}
#ctl{display:flex;gap:8px;padding-block:4px 8px}
button{font:inherit;font-size:14px;font-weight:500;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;flex:1;min-width:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--motion);outline-offset:2px}
#play{flex:1.2;background:var(--fg);color:var(--panel);border-color:var(--fg)}
#scrubrow{padding-block:2px 6px}
#scrub{width:100%;accent-color:var(--measure-fill);margin:0}
#steps{display:flex;gap:6px;padding-block:4px 12px;overflow-x:auto}
#steps button{flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:50%;font-family:var(--num);font-size:13px}
#steps button.on{background:var(--measure-fill);border-color:var(--measure-fill);color:#fff;font-weight:700}
#body{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line);padding-block:14px 22px;display:flex;flex-direction:column;gap:14px}
#body h2{margin:0 0 3px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--motion)}
#body p{margin:0;font-size:15px;line-height:1.7;color:var(--fg)}
#cap{position:absolute;left:0;right:0;bottom:0;padding-block:10px 12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border-top:1px solid var(--line);font-size:15px;line-height:1.55;min-height:4.4em;font-weight:500}
#gauge{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:150px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;text-align:center}
#gauge svg{display:block;width:100%;height:auto}
.g-rim{fill:var(--face);stroke:var(--measure-fill);stroke-width:5}
.g-tick{stroke:var(--mut);stroke-width:1.4}
.g-tick0{stroke:var(--fg);stroke-width:2.4}
.g-band{fill:none;stroke:var(--ok);stroke-width:4;opacity:.75}
#g-needle{stroke:var(--measure-fill);stroke-width:3;stroke-linecap:round}
.g-hub{fill:var(--fg)}
#g-val{font-family:var(--num);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
#g-unit{font-size:11px;color:var(--mut)}
#g-label{font-size:12.5px;line-height:1.35;color:var(--fg);margin-top:4px;font-weight:500}
#g-chip{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor}
#g-chip.ok{color:var(--ok)}#g-chip.bad{color:var(--bad)}
#hint{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));font-size:12px;color:var(--mut);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
@media (max-width:820px){
 #app{flex-direction:column}
 #panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:47%}
 #head{padding-block:10px 4px}h1{font-size:18px}
 #gauge{width:118px;padding:6px 8px 8px}#g-val{font-size:17px}#g-label{font-size:11.5px}
 #cap{font-size:14px;min-height:4.2em}
 #body p{font-size:14.5px}
}
</style>
<div id="app">
 <div id="stage">
  <canvas id="c" aria-label="v10 機台的 3D 調校動畫"></canvas>
  <div id="hint">拖曳旋轉 · 雙指縮放</div>
  <div id="gauge" hidden>
   <svg viewBox="0 0 120 84" role="img" aria-label="千分錶讀值"><path class="g-rim" d="M12 74 A52 52 0 1 1 108 74 Z"/><path id="g-band" class="g-band" d=""/><g id="g-ticks"></g><line id="g-needle" x1="60" y1="66" x2="60" y2="22"/><circle class="g-hub" cx="60" cy="66" r="4"/></svg>
   <div id="g-val">+0.000 <span id="g-unit">mm</span></div>
   <div id="g-label"></div>
   <div id="g-chip" hidden></div>
  </div>
  <div id="cap" class="pad" aria-live="polite"></div>
 </div>
 <aside id="panel">
  <div id="head" class="pad"><p id="kick"></p><h1 id="ttl"></h1></div>
  <div id="ctl" class="pad"><button id="prev" type="button">‹ 上一步</button><button id="play" type="button">暫停</button><button id="next" type="button">下一步 ›</button></div>
  <div id="scrubrow" class="pad"><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="這一步的時間軸"></div>
  <nav id="steps" class="pad" aria-label="步驟"></nav>
  <div id="body" class="pad"></div>
 </aside>
</div>
<!--THREE-->
<script>
/*DATA*/
const $=id=>document.getElementById(id), V=THREE.Vector3;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), sg=(u,a,b)=>clamp((u-a)/(b-a),0,1), ez=t=>t*t*(3-2*t), mix=(a,b,t)=>a+(b-a)*t;
const DEG=Math.PI/180, YAW0=.4*DEG, PIT0=.6*DEG, SPT0=.8*DEG, PHI0=.7*DEG, A0=2.2/540, STY=30;
const cv=$('c'), stage=$('stage');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1,5,9000);cam.up.set(0,0,1);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8070,.78));
const d1=new THREE.DirectionalLight(0xffffff,.72);d1.position.set(800,-1200,1600);scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,.3);d2.position.set(-900,700,600);scene.add(d2);
// groups: base | table (Y) | gantry (yaw + pitch about the right foot's rear corner) > feet, carriage (X) > slide (Z) > spindle
const P0=new V(320,182,0), PS=new V(0,34,331);
const G=()=>new THREE.Group();
const gBase=G(),gY=G(),gGan=G(),gGi=G(),gFeetP=G(),gFeetI=G(),gX=G(),gZ=G(),gSpP=G(),gSpI=G();
scene.add(gBase,gY,gGan);gGan.position.copy(P0);gGan.add(gGi,gFeetP);gGi.position.copy(P0).negate();gFeetP.add(gFeetI);gFeetI.position.copy(P0).negate();
gGi.add(gX);gX.add(gZ);gZ.add(gSpP);gSpP.position.copy(PS);gSpP.add(gSpI);gSpI.position.copy(PS).negate();
const piv={y:G(),x:G(),z:G()};
piv.y.position.set(0,0,45);gY.add(piv.y);piv.x.position.set(0,207,360);gGi.add(piv.x);piv.z.position.set(0,79,0);gX.add(piv.z);
function b64(s,T){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)}
const part={}, EDGE=new THREE.LineBasicMaterial({color:0x1b1f22,transparent:true,opacity:.28});
const FEET=/^Column_foot_/, GAN=/^(Gantry_column_|X_base_plate|X_rail_|X_support_fixed|X_motor|Electrical_panel|Servo_amp_)/, SPN=/^(Spindle_|ER11_nut|Tool_D5)/;
for(const p of DATA){
 const q=b64(p.p,Int16Array),pos=new Float32Array(q.length);for(let i=0;i<q.length;i++)pos[i]=q[i]/10;
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 g.setIndex(new THREE.BufferAttribute(b64(p.i,p.w?Uint16Array:Uint32Array),1));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color(...p.c),metalness:.25,roughness:.55,side:THREE.DoubleSide}));
 if(p.nt<6000)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30),EDGE));
 part[p.n]=m;
 if(p.r){const pv=piv[p.r];g.translate(-pv.position.x,-pv.position.y,-pv.position.z);if(m.children[0])m.children[0].geometry.translate(-pv.position.x,-pv.position.y,-pv.position.z);pv.add(m)}
 else if(FEET.test(p.n))gFeetI.add(m);else if(SPN.test(p.n))gSpI.add(m);
 else if(p.g=='x')gX.add(m);else if(p.g=='z')gZ.add(m);else if(p.g=='y')gY.add(m);
 else if(GAN.test(p.n))gGi.add(m);else gBase.add(m);
}
// ---------- props ----------
const mat=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.2,roughness:.6},o||{}));
const M={granite:mat(0x39424a,{roughness:.8}),steel:mat(0xb9c0c6,{metalness:.6,roughness:.35}),dark:mat(0x2b3238),orange:mat(0xd9622b),white:mat(0xf4f2ec),foot:mat(0xc9a36a),pin:mat(0xe9edf0,{metalness:.8,roughness:.25}),cut:mat(0xe6ebee,{metalness:.7,roughness:.3}),plate:mat(0x9aa4ab,{metalness:.5,roughness:.5})};
function edged(m){m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,30),EDGE));return m}
function box(w,d,h,m,x,y,z){const o=edged(new THREE.Mesh(new THREE.BoxGeometry(w,d,h),m));o.position.set(x||0,y||0,z||0);return o}
function cyl(r,h,m,ax,x,y,z){const g=new THREE.CylinderGeometry(r,r,h,28);if(ax=='z')g.rotateX(Math.PI/2);else if(ax=='x')g.rotateZ(Math.PI/2);const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o}
function ball(r,m,x,y,z){const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);return o}
const labels=[];
function label(text){const c=document.createElement('canvas'),x=c.getContext('2d'),f='600 44px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';x.font=f;
 const w=Math.ceil(x.measureText(text).width)+44;c.width=w;c.height=68;x.font=f;x.fillStyle='rgba(22,35,46,.88)';
 x.beginPath();x.roundRect?x.roundRect(0,0,w,68,14):x.rect(0,0,w,68);x.fill();x.fillStyle='#F6F5F1';x.textBaseline='middle';x.fillText(text,22,36);
 const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,sizeAttenuation:false,transparent:true}));
 s.renderOrder=10;s.userData.asp=w/68;labels.push(s);return s}
function lab(text,parent,x,y,z){const s=label(text);s.position.set(x,y,z);parent.add(s);return s}
const prop={};
// spindle-mounted test indicator: stylus pivot at (0,-80,195), ball 30 below
{const g=G();g.add(cyl(36,8,M.dark,'z',0,0,232),box(8,34,8,M.dark,20,-45,232),box(8,8,22,M.dark,20,-60,221),cyl(18.5,8,M.orange,'z',20,-60,206),cyl(17,10,M.white,'z',20,-60,206));
 const bar=box(6,30,5,M.dark,10,-70,198);bar.rotation.z=-Math.PI/4;g.add(bar);
 const nd=G();nd.position.set(20,-60,211.6);nd.add(box(1.8,14,1,M.orange,0,6,0));g.add(nd);
 const sp=G();sp.position.set(0,-80,195);sp.add(cyl(1.3,STY,M.steel,'z',0,0,-STY/2),ball(2.5,M.orange,0,0,-STY));g.add(sp);
 gZ.add(g);prop.indA=g;g.userData={nd,sp}}
// magnetic-base indicator: contact face at the origin, stylus pointing +y, base H below
function baseInd(H){const g=G(),sty=G();sty.add(ball(2.5,M.orange,0,-2.5,0),cyl(1.3,26,M.steel,'y',0,-16,0));g.add(sty);
 g.add(cyl(18.5,8,M.orange,'z',0,-46,0),cyl(17,10,M.white,'z',0,-46,0),cyl(3,22,M.dark,'z',0,-46,16));
 const nd=G();nd.position.set(0,-46,5.6);nd.add(box(1.8,14,1,M.orange,0,6,0));g.add(nd);
 const arm=box(49.2,6,6,M.dark,22.5,-56,27);arm.rotation.z=Math.atan2(-20,45);g.add(arm);
 g.add(cyl(4,H-13,M.dark,'z',45,-66,27-(H-13)/2),box(50,40,40,M.dark,45,-66,-H+20));g.userData={nd,sty};return g}
// flat granite square on the table: corner (A∩B) at table (-140,-60)
{const g=G();g.position.set(-140,-60,110);g.add(box(300,200,40,M.granite,150,100,20));lab('A 邊',g,-2,100,52);lab('B 邊',g,150,-2,52);lab('花崗石直角尺',g,170,120,46);gY.add(g);prop.sq=g}
// cylinder square
const CYL={x:0,y:-124.5};
{const g=G();g.position.set(CYL.x,CYL.y,110);g.add(cyl(40,150,M.granite,'z',0,0,75));lab('圓柱直角尺',g,0,-46,120);gY.add(g);prop.cyl=g}
// bridge gauge on the lower X rail, indicator on the upper rail
{const g=G();g.add(box(60,26,46,M.dark,0,137,250),box(8,8,150,M.dark,0,130,348),cyl(18.5,8,M.orange,'y',0,122,415),cyl(17,10,M.white,'y',0,122,415),box(6,22,6,M.dark,0,131,428));
 const nd=G();nd.position.set(0,116.4,415);nd.add(box(1.8,1,14,M.orange,0,0,6));g.add(nd);
 const sty=G();sty.add(cyl(1.3,30,M.steel,'z',0,140,442),ball(2.5,M.orange,0,140,457.5));g.add(sty);lab('跨橋量具',g,0,110,300);
 gGi.add(g);prop.bridge=g;g.userData={nd,sty}}
const boltsG=G(),bolts=[];for(let k=0;k<9;k++){const b=cyl(5,3,mat(0xd9622b),'y',-240+60*k,145,470);bolts.push(b);boltsG.add(b)}gGi.add(boltsG);prop.bolts=boltsG;
prop.railLab=G();lab('主軌（已靠肩鎖緊）',prop.railLab,-150,120,226);lab('副軌（螺絲先輕鎖）',prop.railLab,-150,120,500);gGi.add(prop.railLab);
// v11 proposal: front flange on each foot, with bolts
const fbolts=[];for(const sx of[-1,1]){gFeetI.add(box(80,40,18,M.foot,sx*320,-18,9));for(const dx of[-25,25]){const b=cyl(6,7,M.dark,'z',sx*320+dx,-18,21.5);fbolts.push(b);gFeetI.add(b)}}
prop.flLab=G();lab('前凸緣（v11 提案）',prop.flLab,-320,-18,48);gFeetI.add(prop.flLab);
// push blocks
function pushBlock(x){const g=G();g.add(box(40,30,25,M.orange,x,-65,12.5));const s=G();s.position.set(x,-51,12.5);s.add(cyl(4,26,M.steel,'y',0,0,0),cyl(7,6,M.dark,'y',0,-16,0));g.add(s);g.userData.s=s;gBase.add(g);return g}
prop.pushL=pushBlock(-320);prop.pushR=pushBlock(320);prop.pushLab=G();lab('頂推塊',prop.pushLab,-320,-100,40);gBase.add(prop.pushLab);
prop.indB=baseInd(65);prop.indB.position.set(-292,2-612*YAW0,65);gBase.add(prop.indB);
// shims
const SH=220*PIT0;prop.shimL=box(80,30,SH,M.orange,-320,-23,SH/2);prop.shimR=box(80,30,SH,M.orange,320,-23,SH/2);gBase.add(prop.shimL,prop.shimR);
prop.shimLab=G();lab('墊片',prop.shimLab,-320,-60,34);gBase.add(prop.shimLab);
// reamer and dowel pins
{const g=G();g.add(cyl(4,70,M.steel,'z',0,0,35),cyl(11,36,M.dark,'z',0,0,88));g.position.set(-320,-18,0);gBase.add(g);prop.ream=g}
prop.pinL=cyl(4,26,M.pin,'z',-320,-18,8);prop.pinR=cyl(4,26,M.pin,'z',320,-18,8);gBase.add(prop.pinL,prop.pinR);
prop.pinLab=G();lab('定位銷',prop.pinLab,-320,-18,60);gBase.add(prop.pinLab);
// test bar, clamp shim, table-mounted indicators for the spindle
prop.bar=cyl(3.5,80,M.steel,'z',0,0,162);gSpI.add(prop.bar);
prop.shimS=box(96,1.6,20,M.orange,0,34.8,391);lab('墊片',prop.shimS,70,0,16);gZ.add(prop.shimS);
prop.indX=baseInd(72);prop.indX.rotation.z=Math.PI/2;prop.indX.position.set(3.5,-1.9,182);gY.add(prop.indX);
const BARF0=(192-331)*SPT0-3.5;prop.indY=baseInd(72);prop.indY.position.set(0,BARF0,182);gY.add(prop.indY);
prop.barLab=G();lab('檢驗棒',prop.barLab,46,-6,206);gSpI.add(prop.barLab);
// fixture plate and milled stripes
{const g=G();g.add(box(300,400,25,M.plate,0,50,122.5));lab('治具板',g,0,-150,150);const st=[];for(let k=0;k<10;k++){const s=new THREE.Mesh(new THREE.PlaneGeometry(300,40),M.cut);s.position.set(0,-130+40*k,135.3);st.push(s);g.add(s)}g.userData.st=st;gY.add(g);prop.fix=g}
// axis triad
{const g=G(),o=new V(-430,-230,0);for(const[d,c,t]of[[new V(1,0,0),0xd9622b,'X'],[new V(0,1,0),0x2a6f97,'Y'],[new V(0,0,1),0x2e7d4f,'Z']]){g.add(new THREE.ArrowHelper(d,o,170,c,34,18));lab(t,g,o.x+d.x*200,o.y+d.y*200,o.z+d.z*200)}scene.add(g);prop.axes=g}
// ---------- scenes ----------
const SC=[
{t:'三條軸線與六個關係',dur:14,cam:{p:[1370,-1440,1200],t:[20,100,340]},
 sec:[['這份動畫','依組裝順序，演示每一項怎麼量、為什麼這樣量、量完怎麼調。可以拖曳旋轉視角，也可以拖時間軸前後看。'],['要確認的關係','X ⊥ Y、Z ⊥ Y、Z ⊥ X、各軸兩支線軌平行、主軸 ∥ Z、治具板面平行於 X-Y 運動。'],['畫面上的誇大','誤差在畫面上放大了數十倍才看得見。左上角錶上的讀值才是實際大小。']],
 f(u,S){S.show('axes');if(u<.34){S.y=-150*Math.sin(2*Math.PI*u/.34);S.cap='Y 軸：工作台前後移動。'}else if(u<.67){S.x=140*Math.sin(2*Math.PI*(u-.34)/.33);S.cap='X 軸：滑座沿龍門左右移動。'}else{S.z=45*Math.sin(2*Math.PI*(u-.67)/.33);S.cap='Z 軸：主軸上下移動。'}}},
{t:'線軌平行',dur:20,cam:{p:[330,-1150,640],t:[0,150,360]},

SC.forEach((s,k)=>{const b=document.createElement('button');b.type='button';b.textContent=k+1;b.title=s.t;b.setAttribute('aria-label','第 '+(k+1)+' 步：'+s.t);b.onclick=()=>go(k);$('steps').appendChild(b)});
function setPlay(p){playing=p;$('play').textContent=p?'暫停':'播放'}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
$('play').onclick=()=>{if(!playing&&u>=1)u=0;setPlay(!playing)};
$('scrub').oninput=e=>{setPlay(false);u=+e.target.value/1000;hold=0};
ctl.addEventListener('start',()=>{camA=null;$('hint').hidden=true});
function bg(){scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim())}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',bg);new MutationObserver(bg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 const sy=clamp(h*.05,18,26)/h*2*Math.tan(cam.fov*DEG/2);for(const s of labels)s.scale.set(sy*s.userData.asp,sy,1)}
new ResizeObserver(()=>{resize();if(!camA){const c=camFor(cur);cam.position.copy(c.p);ctl.target.copy(c.t)}}).observe(stage);
let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(playing){if(u>=1){hold+=dt;if(hold>1.6){u=0;hold=0}}else u=Math.min(1,u+dt/SC[cur].dur)}
 $('scrub').value=Math.round(u*1000);
 if(camA){camA.k=Math.min(1,camA.k+dt/.9);const e=ez(camA.k);cam.position.lerpVectors(camA.p0,camA.p1,e);ctl.target.lerpVectors(camA.t0,camA.t1,e);if(camA.k>=1)camA=null}
 frame(cur,u);ctl.update();R.render(scene,cam);requestAnimationFrame(tick)}
window.__go=(i,v)=>{go(i,true);setPlay(false);u=v;frame(cur,u);ctl.update();R.render(scene,cam)};
bg();resize();go(0,true);setPlay(playing);requestAnimationFrame(tick);
</script>
