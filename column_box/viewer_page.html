<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>立柱電箱 3D</title>
<style>html,body{margin:0;height:100%;background:#eef1f4;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#1d2630}
#c{width:100%;height:100%;display:block}
#ui{position:absolute;left:12px;top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#ffffffe6;border:1px solid #c9d1da;border-radius:8px;padding:6px 10px;max-width:calc(100% - 44px)}
button{font:inherit;font-size:13px;padding:4px 10px;border:1px solid #9aa6b3;border-radius:6px;background:#fff;cursor:pointer}
label{font-size:13px;margin-right:6px;white-space:nowrap}
#info{position:absolute;left:12px;bottom:10px;background:#ffffffe6;border:1px solid #c9d1da;border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.6;max-width:min(680px,calc(100% - 48px))}
#lbs{position:absolute;inset:0;pointer-events:none;overflow:hidden}.lb{position:absolute;left:0;top:0;font-size:11.5px;line-height:1.2;background:#ffffffd9;color:#1d2630;border:1px solid #8793a0;border-radius:4px;padding:1px 5px;white-space:nowrap;transform:translate(-50%,-50%)}
#tip{position:absolute;right:12px;top:10px;background:#1d2630;color:#fff;border-radius:6px;padding:4px 8px;font-size:12px;display:none}</style></head>
<body><canvas id="c"></canvas>
<div id="ui"><b>立柱電箱 3D</b>
<button data-v="back">從後面看（維修面）</button><button data-v="below">後下方</button><button data-v="iso">等角</button><button data-v="front">從前面看</button>
<button id="lbtn">標示：開</button><span id="tg"></span></div>
<div id="lbs"></div><div id="tip"></div><div id="info">/*INFO*/</div>
<!--THREE-->
<script>
/*DATA*/
const cv=document.getElementById('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xeef1f4);
const cam=new THREE.PerspectiveCamera(30,1,5,8000);cam.up.set(0,0,1);const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8070,0.9));const d1=new THREE.DirectionalLight(0xffffff,0.7);d1.position.set(-600,-900,900);scene.add(d1);
function b64(s,T){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new T(u.buffer)}
const MESH=[],LB=[];let showLB=true;
for(const p of DATA){const q=b64(p.p,Int16Array),pos=new Float32Array(q.length);for(let i=0;i<q.length;i++)pos[i]=q[i]/10;
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(new THREE.BufferAttribute(b64(p.i,p.w?Uint16Array:Uint32Array),1));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:new THREE.Color(...p.c),metalness:0.15,roughness:0.6,side:THREE.DoubleSide,transparent:!!p.t,opacity:p.t?0.25:1,depthWrite:!p.t}));
 m.userData={n:p.n,s:p.s};scene.add(m);MESH.push(m);if(p.l){g.computeBoundingBox();const c=new THREE.Vector3();g.boundingBox.getCenter(c);const d=document.createElement('div');d.className='lb';d.textContent=p.l;document.getElementById('lbs').appendChild(d);LB.push({m,c,d})}}
const T=new THREE.Vector3(0,375,370);
const VIEWS={below:[420,1250,150],front:[0,-1500,380],iso:[900,-700,900],back:[0,1900,380]};
function view(k){cam.position.set(...VIEWS[k]);ctl.target.copy(T);ctl.update()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const SH=[['wall','垂直板'],['roof','水平板'],['rails','DIN 軌'],['nuts','拉帽']];
const tg=document.getElementById('tg');
for(const [k,l] of SH){const lb=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;
 cb.onchange=()=>{for(const m of MESH)if(m.userData.s===k)m.visible=cb.checked};cb.onchange();lb.append(cb,' '+l);tg.append(lb)}
const ray=new THREE.Raycaster(),mv=new THREE.Vector2(),tip=document.getElementById('tip');
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,cam);
 const h=ray.intersectObjects(MESH.filter(m=>m.visible),false);if(h.length){tip.style.display='block';tip.textContent=h[0].object.userData.n}else tip.style.display='none'});
window.view=view;window.renderOnce=()=>{ctl.update();R.render(scene,cam)};
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();view('back');
const v3=new THREE.Vector3();
function placeLabels(){const w=cv.clientWidth,h=cv.clientHeight;for(const o of LB){if(!showLB||!o.m.visible){o.d.style.display='none';continue}v3.copy(o.c).project(cam);if(v3.z>1){o.d.style.display='none';continue}o.d.style.display='block';o.d.style.transform='translate('+((v3.x*0.5+0.5)*w)+'px,'+((-v3.y*0.5+0.5)*h)+'px) translate(-50%,-50%)'}}
document.getElementById('lbtn').onclick=e=>{showLB=!showLB;e.target.textContent=showLB?'標示：開':'標示：關'};
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(scene,cam);placeLabels()})();
</script></body></html>
